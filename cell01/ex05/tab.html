<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tab Basic</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            height: 100px;
            
            
        }
        .td1 {
            border: 1px solid black;
            padding: 4px;
            background-color: #FFC0CB;
        }
        .td2 {
            border: 1px solid black;
            padding: 4px;
            background-color: #ADD8E6;
        }
    </style>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td class="td1"> Item 1 </td1>
                <td class="td2"> Item 2 </td2>
            </tr>
        </tbody>
    </table>
</body>
</html>
