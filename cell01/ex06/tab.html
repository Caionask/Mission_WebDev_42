<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Tab Basic</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        table {
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            height: 100vh;
            width: 100vh;
        }

        .cu {
            background-color: #fc93d4;
        }

        .rioso {
            background-color: #fbff00;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="cu">Cu</td>
            <td class="rioso">Rioso</td>
        </tr>
    </table>


</body>

</html>
